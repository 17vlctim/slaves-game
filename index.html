<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Империя</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #17212b; --card: #242f3d; --text: #ffffff; --primary: #2481cc; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 80px; }
        
        .header { background: var(--card); padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #333; }
        .stats { display: flex; gap: 15px; font-weight: bold; font-size: 16px; }
        .gold { color: #f1c40f; } .energy { color: #2ecc71; }
        
        .content { padding: 15px; }
        
        /* Меню снизу (3D кнопки) */
        .tabs { display: flex; position: fixed; bottom: 0; width: 100%; z-index: 10; background: #17212b; padding: 10px 5px calc(10px + env(safe-area-inset-bottom)) 5px; justify-content: space-around; border-top: 1px solid #242f3d;}
        .tab-btn { flex: 1; max-width: 70px; margin: 0 2px; background: var(--card); border: none; border-radius: 12px; padding: 8px 0; color: #8b9bb4; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; box-shadow: 0 4px 0 #1a222c; transition: all 0.1s; }
        .tab-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #1a222c; }
        .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 0 #1a5a91; }
        .tab-btn .icon { font-size: 22px; }
        .tab-btn .text { font-size: 10px; font-weight: bold; }

        /* Карточки */
        .card { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #555; }
        .rarity-Обычный { border-left-color: #aaa; } .rarity-Редкий { border-left-color: #3498db; } 
        .rarity-Эпический { border-left-color: #9b59b6; } .rarity-Игрок { border-left-color: #e67e22; }

        /* Кнопки */
        .btn { padding: 12px 15px; border-radius: 12px; border: none; color: white; font-weight: bold; cursor: pointer; font-size: 14px; text-align: center; transition: transform 0.1s; box-shadow: 0 4px 0 rgba(0,0,0,0.2); }
        .btn:active { transform: translateY(2px); box-shadow: none; }
        .btn-green { background: #2ecc71; color: #000; box-shadow: 0 4px 0 #1f9c52;}
        .btn-red { background: #e74c3c; box-shadow: 0 4px 0 #b03a2e;}
        .btn-orange { background: #e67e22; box-shadow: 0 4px 0 #b86318;}
        .btn-purple { background: #9b59b6; box-shadow: 0 4px 0 #7d4394;}
        .btn-yellow { background: #f1c40f; color: #000; box-shadow: 0 4px 0 #c0a00c;}
        .btn-full { width: 100%; margin-bottom: 10px; padding: 15px; font-size: 16px;}
        
        /* Главная */
        .income-block { text-align: center; background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%); padding: 25px 20px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .income-block h1 { margin: 0; font-size: 36px; color: #f1c40f; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .income-block p { margin: 5px 0 0 0; color: #ddd; font-size: 14px; }

        /* Профиль */
        .profile-info { text-align: center; background: var(--card); padding: 20px; border-radius: 15px; margin-bottom: 15px; }
        .profile-avatar { font-size: 60px; margin-bottom: 10px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .profile-stat { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #333; font-size: 15px;}

        /* Рейтинг */
        .select-custom { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px; background: var(--card); color: white; border: 1px solid #444; font-size: 15px; font-weight: bold; outline: none; appearance: none; }
        .lb-card { display: flex; justify-content: space-between; padding: 12px; background: var(--card); margin-bottom: 8px; border-radius: 10px; align-items: center; }
        .lb-card.me { border: 2px solid var(--primary); }
        
        .admin-panel { display: none; margin-top: 20px; padding: 15px; border: 2px dashed #9b59b6; border-radius: 10px; }

        /* Уведомления (Toasts) */
        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; width: 90%; max-width: 400px; }
        .toast { background: #2ecc71; color: white; padding: 15px 20px; border-radius: 12px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.4); text-align: center; animation: slideDown 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .toast.error { background: #e74c3c; }
        @keyframes slideDown { from { top: -100px; opacity: 0; } to { top: 0; opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.9); } }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="header">
        <div class="stats">
            <span class="gold">💰 <span id="my-gold">0</span></span>
            <span class="energy">⚡ <span id="my-energy">0</span></span>
        </div>
    </div>

    <div class="content">
        <!-- 1. ГЛАВНАЯ -->
        <div id="tab-home" style="display: block;">
            <div class="income-block">
                <h1><span id="income-per-hour">0</span> 💰</h1>
                <p>Твой доход в час</p>
            </div>
            
            <button id="daily-btn" class="btn btn-yellow btn-full" onclick="claimDaily()" style="display:none;">🎁 Забрать ежедневный бонус</button>
            <button id="collect-btn" class="btn btn-yellow btn-full" onclick="collectIncome()" style="display:none;">Собрать <span id="pending-amount">0</span>💰</button>
            
            <button class="btn btn-orange btn-full" onclick="doWork()">🔨 Поработать (-10⚡, +50💰)</button>
        </div>

        <!-- 2. РЫНОК -->
        <div id="tab-market" style="display: none;">
            <h3 style="margin-top:0;">Глобальный рынок:</h3>
            <div id="market-list">Загрузка...</div>
        </div>

        <!-- 3. ИМПЕРИЯ -->
        <div id="tab-empire" style="display: none;">
            <div id="owner-info" style="margin-bottom: 15px;"></div>
            <h3 style="margin-top:0;">Мои подчиненные:</h3>
            <div id="slaves-list">Загрузка...</div>
        </div>

        <!-- 4. РЕЙТИНГ -->
        <div id="tab-rating" style="display: none;">
            <select id="lb-sort" class="select-custom" onchange="renderLeaderboard()">
                <option value="gold">🏆 Топ-100 по богатству (💰)</option>
                <option value="income">📈 Топ-100 по доходу в час</option>
            </select>
            <div id="leaderboard">Загрузка...</div>
        </div>

        <!-- 5. ПРОФИЛЬ -->
        <div id="tab-profile" style="display: none;">
            <div class="profile-info">
                <div class="profile-avatar">👤</div>
                <h2 id="profile-name" style="margin:0;">Игрок</h2>
            </div>
            
            <div class="card" style="flex-direction: column; align-items: stretch; padding: 0;">
                <div class="profile-stat"><span>Приглашено друзей:</span> <b id="stat-ref">0</b></div>
                <div class="profile-stat"><span>Куплено рабов:</span> <b id="stat-bought">0</b></div>
                <div class="profile-stat" style="border:none;"><span>Раз продан:</span> <b id="stat-sold">0</b></div>
            </div>

            <button class="btn btn-green btn-full" style="margin-top: 15px;" onclick="inviteFriend()">🤝 Пригласить друга (+500💰)</button>

            <div id="admin-panel" class="admin-panel">
                <h4 style="margin-top:0; color:#9b59b6;">Панель Владельца</h4>
                <button class="btn btn-purple btn-full" onclick="cheatMoney()">💸 Накинуть 10 000 монет</button>
            </div>
        </div>
    </div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('home', this)"><span class="icon">🏠</span><span class="text">Главная</span></button>
        <button class="tab-btn" onclick="switchTab('market', this)"><span class="icon">🛒</span><span class="text">Рынок</span></button>
        <button class="tab-btn" onclick="switchTab('empire', this)"><span class="icon">👑</span><span class="text">Империя</span></button>
        <button class="tab-btn" onclick="switchTab('rating', this)"><span class="icon">🏆</span><span class="text">Рейтинг</span></button>
        <button class="tab-btn" onclick="switchTab('profile', this)"><span class="icon">👤</span><span class="text">Профиль</span></button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();
        
        const urlParams = new URLSearchParams(window.location.search);
        const tgUser = tg.initDataUnsafe?.user;
        const userId = tgUser ? tgUser.id : urlParams.get('user_id');
        const userName = tgUser ? tgUser.first_name : (urlParams.get('name') || "Игрок");
        
        let botUsername = "";
        let rawLeaderboard = [];

        if (!userId) {
            document.body.innerHTML = "<h3 style='padding:20px; text-align:center;'>Ошибка: Открой игру через бота!</h3>";
        } else {
            loadState(userName);
            setInterval(() => loadState(userName), 30000); 
        }

        // --- ВСПЛЫВАЮЩИЕ УВЕДОМЛЕНИЯ ---
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = (type === 'success' ? '✅ ' : '❌ ') + message;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.3s ease-in forwards';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        function switchTab(tab, btn) {
            ['home', 'market', 'empire', 'rating', 'profile'].forEach(t => {
                document.getElementById(`tab-${t}`).style.display = t === tab ? 'block' : 'none';
            });
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        async function loadState(name) {
            try {
                const res = await fetch(`/api/state?user_id=${userId}&name=${encodeURIComponent(name)}`);
                const data = await res.json();

                botUsername = data.bot_username;

                document.getElementById('my-gold').innerText = data.gold;
                document.getElementById('my-energy').innerText = data.energy;
                document.getElementById('income-per-hour').innerText = data.income_per_hour;

                document.getElementById('daily-btn').style.display = data.can_daily ? 'block' : 'none';
                if (data.pending_income > 0) {
                    document.getElementById('collect-btn').style.display = 'block';
                    document.getElementById('pending-amount').innerText = data.pending_income;
                } else {
                    document.getElementById('collect-btn').style.display = 'none';
                }

                document.getElementById('profile-name').innerText = data.my_name;
                document.getElementById('stat-ref').innerText = data.ref_count;
                document.getElementById('stat-bought').innerText = data.bought_count;
                document.getElementById('stat-sold').innerText = data.sold_count;
                if (data.is_admin) document.getElementById('admin-panel').style.display = 'block';

                // Рынок
                const marketList = document.getElementById('market-list');
                marketList.innerHTML = '';
                if(data.market.length === 0) marketList.innerHTML = "<p style='color:#aaa;'>Пока никого нет.</p>";
                
                data.market.forEach(p => {
                    const div = document.createElement('div');
                    div.className = `card rarity-${p.rarity}`;
                    let btnHtml = p.owner_id ? `<span style="color:#e74c3c; font-size: 12px; font-weight:bold;">Занят</span>` 
                    : `<button class="btn btn-green" onclick="buyPlayer('${p.id}')">Купить<br>${p.price}💰</button>`;
                    
                    div.innerHTML = `<div><b>${p.name}</b><br><small style="color:#aaa;">${p.rarity}</small></div> ${btnHtml}`;
                    marketList.appendChild(div);
                });

                // Империя
                const slavesList = document.getElementById('slaves-list');
                slavesList.innerHTML = '';
                if (data.my_slaves.length === 0) slavesList.innerHTML = '<p style="color:#aaa;">Пусто.</p>';
                
                data.my_slaves.forEach(s => {
                    const div = document.createElement('div');
                    div.className = `card rarity-${s.rarity}`;
                    let btnHtml = '';
                    
                    if (s.is_npc) {
                        let upgCost = s.income * 100; 
                        btnHtml = `<div style="text-align:right;"><span style="color:#2ecc71; font-size:12px; display:block; margin-bottom:5px;">+${s.income}💰/час</span>
                        <button class="btn btn-purple" style="padding: 8px; font-size:12px;" onclick="upgradeNpc('${s.id}')">Улучшить<br><small>${upgCost}💰</small></button></div>`;
                    } else {
                        btnHtml = `<span style="color:#2ecc71; font-size:12px; font-weight:bold;">+${s.income}💰/час</span>`;
                    }

                    div.innerHTML = `<div><b>${s.name}</b><br><small style="color:#aaa;">Ур. ${s.level}</small></div> ${btnHtml}`;
                    slavesList.appendChild(div);
                });

                // Владелец
                const ownerInfo = document.getElementById('owner-info');
                if (data.my_owner) {
                    ownerInfo.innerHTML = `<div class="card" style="border-left-color:#e74c3c; flex-direction:column; align-items:flex-start;">
                        <div>Владелец: <b>${data.my_owner}</b></div>
                        <button class="btn btn-red" style="width:100%; margin-top:10px;" onclick="redeemSelf()">Выкупить себя</button>
                    </div>`;
                } else {
                    ownerInfo.innerHTML = `<div class="card" style="border-left-color:#2ecc71; justify-content:center;"><b>Ты свободен!</b></div>`;
                }

                // Рейтинг
                rawLeaderboard = data.leaderboard;
                renderLeaderboard();

            } catch (e) { console.error(e); }
        }

        // --- РЕНДЕР РЕЙТИНГА ---
        function renderLeaderboard() {
            const sortKey = document.getElementById('lb-sort').value;
            const lbList = document.getElementById('leaderboard');
            lbList.innerHTML = '';

            // Сортируем копию массива
            let sorted = [...rawLeaderboard].sort((a, b) => b[sortKey] - a[sortKey]).slice(0, 100);

            sorted.forEach((u, i) => {
                let medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}.`;
                let val = sortKey === 'gold' ? `${u.gold}💰` : `+${u.income}💰/ч`;
                let isMe = (u.id == userId) ? "me" : ""; // Если это текущий игрок, выделим

                lbList.innerHTML += `<div class="lb-card ${isMe}">
                    <span><span style="display:inline-block; width:30px;">${medal}</span> ${u.name}</span> 
                    <b>${val}</b>
                </div>`;
            });
        }

        // --- ПРИГЛАШЕНИЕ ДРУЗЕЙ ---
        function inviteFriend() {
            if (!botUsername) return;
            
            const botLink = `https://t.me/${botUsername}?start=${userId}`;
            
            // 1. Копируем в буфер
            navigator.clipboard.writeText(botLink).then(() => {
                showToast('Ссылка скопирована!');
            }).catch(err => {
                console.error('Ошибка копирования', err);
            });

            // 2. Открываем меню "Поделиться" в Telegram
            const shareText = `Присоединяйся к моей Империи! Забери свои 1000 монет:`;
            const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(botLink)}&text=${encodeURIComponent(shareText)}`;
            
            // Небольшая задержка, чтобы юзер увидел тост
            setTimeout(() => {
                tg.openTelegramLink(shareUrl);
            }, 500);
        }

        // --- ДЕЙСТВИЯ (API) ---
        async function claimDaily() {
            const res = await fetch('/api/daily', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ user_id: userId }) });
            const data = await res.json();
            if (data.success) { tg.HapticFeedback.notificationOccurred('success'); showToast('Бонус получен!'); loadState(userName); } 
            else showToast(data.error, 'error');
        }

        async function collectIncome() {
            const res = await fetch('/api/collect', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ user_id: userId }) });
            const data = await res.json();
            if (data.success) { tg.HapticFeedback.notificationOccurred('success'); showToast('Доход собран!'); loadState(userName); } 
            else showToast(data.error, 'error');
        }

        async function doWork() {
            const res = await fetch('/api/work', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ user_id: userId }) });
            const data = await res.json();
            if (data.success) { tg.HapticFeedback.impactOccurred('light'); showToast('+50 монет!'); loadState(userName); } 
            else showToast(data.error, 'error');
        }

        async function buyPlayer(targetId) {
            if(!confirm("Купить этого игрока?")) return;
            const res = await fetch('/api/buy', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ user_id: userId, target_id: targetId }) });
            const data = await res.json();
            if (data.success) { tg.HapticFeedback.notificationOccurred('success'); showToast('Успешно куплен!'); loadState(userName); } 
            else showToast(data.error, 'error');
        }

        async function upgradeNpc(targetId) {
            const res = await fetch('/api/upgrade', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ user_id: userId, target_id: targetId }) });
            const data = await res.json();
            if (data.success) { tg.HapticFeedback.notificationOccurred('success'); showToast('Улучшено!'); loadState(userName); } 
            else showToast(data.error, 'error');
        }

        async function redeemSelf() {
            if(!confirm("Выкупить себя из рабства?")) return;
            const res = await fetch('/api/redeem', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ user_id: userId }) });
            const data = await res.json();
            if (data.success) { tg.HapticFeedback.notificationOccurred('success'); showToast('Ты свободен!'); loadState(userName); } 
            else showToast(data.error, 'error');
        }

        async function cheatMoney() {
            const res = await fetch('/api/admin_cheat', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ user_id: userId, amount: 10000 }) });
            const data = await res.json();
            if (data.success) { showToast('+10 000 монет!'); loadState(userName); } 
            else showToast(data.error, 'error');
        }
    </script>
</body>
</html>
