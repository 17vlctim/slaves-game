<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Империя</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { 
            --bg: #17212b; 
            --card: #232e3c; 
            --text: #ffffff; 
            --text-muted: #7A8A9E;
            --primary: #2AABEE; 
            --gold: #F5B041;
            --green: #2ECC71;
            --red: #E74C3C;
            --purple: #9b59b6;
        }
        
        * { box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding-bottom: 80px; 
            -webkit-tap-highlight-color: transparent;
        }

        /* Шапка */
        .header { 
            background: rgba(23, 33, 43, 0.9); 
            backdrop-filter: blur(10px);
            padding: 12px 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; 
            top: 0; 
            z-index: 10; 
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .stats { display: flex; gap: 12px; font-weight: 600; font-size: 15px; }
        .stat-pill { display: flex; align-items: center; gap: 5px; background: var(--card); padding: 6px 12px; border-radius: 20px; }
        .gold { color: var(--gold); } 
        .energy { color: var(--green); }

        .content { padding: 15px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Нижнее меню */
        .tabs { 
            display: flex; 
            position: fixed; 
            bottom: 0; 
            width: 100%; 
            background: rgba(35, 46, 60, 0.95); 
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.05);
            padding: 8px 0 calc(8px + env(safe-area-inset-bottom)) 0; 
            justify-content: space-around; 
            z-index: 10;
        }
        .tab-btn { 
            flex: 1; 
            background: transparent; 
            border: none; 
            color: var(--text-muted); 
            cursor: pointer; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 4px; 
            transition: color 0.2s;
        }
        .tab-btn.active { color: var(--primary); }
        .tab-icon { width: 24px; height: 24px; background-color: var(--text-muted); mask-size: contain; mask-repeat: no-repeat; mask-position: center; -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; }
        .tab-btn.active .tab-icon { background-color: var(--primary); }
        .tab-text { font-size: 10px; font-weight: 600; }

        /* Карточки */
        .card { 
            background: var(--card); 
            border-radius: 16px; 
            padding: 12px; 
            margin-bottom: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border: 1px solid rgba(255,255,255,0.03);
        }
        .card-left { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 48px; height: 48px; border-radius: 50%; background: #1a2533; object-fit: cover; }
        
        /* Рамки редкости */
        .rarity-Обычный { border-left: 3px solid #7A8A9E; } 
        .rarity-Редкий { border-left: 3px solid var(--primary); } 
        .rarity-Эпический { border-left: 3px solid var(--purple); } 
        .rarity-Игрок { border-left: 3px solid var(--gold); }

        .item-title { font-size: 15px; font-weight: 600; margin-bottom: 2px;}
        .item-sub { font-size: 12px; color: var(--text-muted); }

        /* Кнопки */
        .btn { 
            padding: 10px 16px; 
            border-radius: 12px; 
            border: none; 
            color: white; 
            font-weight: 600; 
            cursor: pointer; 
            font-size: 14px; 
            text-align: center; 
            transition: opacity 0.2s, transform 0.1s; 
            background: var(--primary);
        }
        .btn:active { transform: scale(0.96); opacity: 0.8; }
        .btn-green { background: var(--green); color: #000; }
        .btn-red { background: var(--red); }
        .btn-purple { background: var(--purple); }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-full { width: 100%; padding: 16px; font-size: 16px; margin-bottom: 12px; border-radius: 16px; display: flex; justify-content: center; align-items: center; gap: 8px;}
        
        /* Главная */
        .income-block { 
            text-align: center; 
            background: linear-gradient(180deg, #232e3c 0%, #17212b 100%); 
            padding: 30px 20px; 
            border-radius: 24px; 
            margin-bottom: 20px; 
            border: 1px solid rgba(42, 171, 238, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .income-block h1 { margin: 0; font-size: 42px; color: var(--gold); font-weight: 800; }
        .income-block p { margin: 5px 0 0 0; color: var(--text-muted); font-size: 14px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px;}

        /* Профиль */
        .profile-info { text-align: center; padding: 20px; margin-bottom: 20px; }
        .profile-avatar { width: 90px; height: 90px; border-radius: 50%; background: var(--card); margin: 0 auto 15px auto; border: 3px solid var(--primary); object-fit: cover;}
        .profile-name { font-size: 22px; font-weight: 700; margin: 0; }
        
        .stat-row { display: flex; justify-content: space-between; padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 15px;}
        .stat-row:last-child { border-bottom: none; }
        .stat-row span { color: var(--text-muted); }
        .stat-row b { font-weight: 600; }

        /* Рейтинг */
        .select-custom { 
            width: 100%; padding: 14px; margin-bottom: 20px; border-radius: 14px; 
            background: var(--card); color: white; border: none; font-size: 15px; 
            font-weight: 600; outline: none; appearance: none; 
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23FFFFFF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat; background-position: right 15px top 50%; background-size: 12px auto;
        }
        
        .lb-card { display: flex; justify-content: space-between; padding: 12px 15px; background: var(--card); margin-bottom: 8px; border-radius: 14px; align-items: center; border: 1px solid transparent;}
        .lb-card.me { border-color: var(--primary); background: rgba(42, 171, 238, 0.1); }
        .lb-left { display: flex; align-items: center; gap: 12px; }
        .lb-rank { font-size: 16px; font-weight: 700; color: var(--text-muted); width: 25px; }
        .lb-card:nth-child(1) .lb-rank { color: var(--gold); }
        .lb-card:nth-child(2) .lb-rank { color: #C0C0C0; }
        .lb-card:nth-child(3) .lb-rank { color: #CD7F32; }
        
        /* Магазин */
        .shop-item { background: var(--card); border-radius: 20px; padding: 20px; text-align: center; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .shop-item h3 { margin: 0 0 5px 0; color: var(--text); font-size: 18px;}
        .shop-item p { color: var(--text-muted); font-size: 13px; margin-bottom: 15px;}
        
        /* Админка */
        .admin-panel { margin-top: 20px; padding: 15px; border: 2px dashed var(--purple); border-radius: 16px; }

        /* Уведомления (Toasts) */
        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; width: 90%; max-width: 400px; }
        .toast { 
            background: var(--card); color: white; padding: 14px 20px; border-radius: 14px; font-weight: 600; font-size: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; 
            animation: slideDown 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
            border: 1px solid rgba(255,255,255,0.1);
        }
        .toast.success { border-bottom: 3px solid var(--green); }
        .toast.error { border-bottom: 3px solid var(--red); }
        @keyframes slideDown { from { top: -100px; opacity: 0; } to { top: 0; opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.9); } }

        /* Заглушка для картинок */
        .img-placeholder { background: #1a2533; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: var(--text-muted); font-size: 20px; }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="header">
        <div class="stats">
            <div class="stat-pill gold"><span>💰</span> <span id="my-gold">0</span></div>
            <div class="stat-pill energy"><span>⚡</span> <span id="my-energy">0</span></div>
        </div>
    </div>

    <div class="content">
        <!-- 1. ГЛАВНАЯ -->
        <div id="tab-home" style="display: block;">
            <div class="income-block">
                <h1><span id="income-per-hour">0</span></h1>
                <p>Доход в час</p>
            </div>
            
            <button id="daily-btn" class="btn btn-gold btn-full" onclick="claimDaily()" style="display:none;">Забрать ежедневный бонус</button>
            <button id="collect-btn" class="btn btn-green btn-full" onclick="collectIncome()" style="display:none;">Собрать <span id="pending-amount">0</span> монет</button>
            
            <button class="btn btn-full" style="background: var(--card); border: 1px solid rgba(255,255,255,0.1);" onclick="doWork()">Поработать <span style="color: var(--text-muted); font-size: 13px;">(-10 энергии, +50 монет)</span></button>
            
            <button id="ad-btn" class="btn btn-full" style="background: var(--card); border: 1px solid var(--primary); color: var(--primary);" onclick="watchAd()" >Посмотреть рекламу <span style="opacity: 0.7; font-size: 13px; margin-left:5px;">(+250 монет)</span></button>
            <button id="ad-wait-btn" class="btn btn-full" style="display:none; background:var(--card); color:var(--text-muted); border:1px solid rgba(255,255,255,0.05);" disabled>Реклама через час</button>
        </div>

        <!-- 2. РЫНОК -->
        <div id="tab-market" style="display: none;">
            <h3 style="margin-top:0; font-weight:600; font-size:18px;">Глобальный рынок</h3>
            <div id="market-list"></div>
        </div>

        <!-- 3. ИМПЕРИЯ -->
        <div id="tab-empire" style="display: none;">
            <div id="owner-info" style="margin-bottom: 15px;"></div>
            <h3 style="margin-top:0; font-weight:600; font-size:18px;">Мои подчиненные</h3>
            <div id="slaves-list"></div>
        </div>

        <!-- 4. РЕЙТИНГ -->
        <div id="tab-rating" style="display: none;">
            <select id="lb-sort" class="select-custom" onchange="renderLeaderboard()">
                <option value="gold">Топ-100 по богатству</option>
                <option value="income">Топ-100 по доходу в час</option>
            </select>
            <div id="leaderboard"></div>
        </div>

        <!-- 5. МАГАЗИН -->
        <div id="tab-shop" style="display: none;">
            <h3 style="margin-top:0; font-weight:600; font-size:18px; text-align:center; margin-bottom:20px;">Магазин</h3>
            
            <div class="shop-item">
                <h3>10 000 монет</h3>
                <p>Мгновенное пополнение баланса</p>
                <button class="btn btn-green" style="width:100%;" onclick="buyStars('10k')">Купить за 50 Stars</button>
            </div>
            
            <div class="shop-item" style="border-color: var(--purple);">
                <h3>Сундук Императора</h3>
                <p>Шанс выпадения редкого NPC или 50 000 монет</p>
                <button class="btn btn-purple" style="width:100%;" onclick="buyStars('chest')">Купить за 100 Stars</button>
            </div>
        </div>

        <!-- 6. ПРОФИЛЬ -->
        <div id="tab-profile" style="display: none;">
            <div class="profile-info">
                <img src="img/avatar_1.jpg" class="profile-avatar" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="profile-avatar img-placeholder" style="display:none;">?</div>
                <h2 id="profile-name" class="profile-name">Игрок</h2>
            </div>
            
            <div class="card" style="flex-direction: column; align-items: stretch; padding: 0;">
                <div class="stat-row"><span>Приглашено друзей:</span> <b id="stat-ref">0</b></div>
                <div class="stat-row"><span>Куплено рабов:</span> <b id="stat-bought">0</b></div>
                <div class="stat-row"><span>Раз продан:</span> <b id="stat-sold">0</b></div>
            </div>

            <button class="btn btn-green btn-full" style="margin-top: 20px;" onclick="inviteFriend()">Пригласить друга</button>

            <div id="admin-panel" class="admin-panel">
                <h4 style="margin-top:0; color:var(--purple); text-align:center;">Панель Владельца</h4>
                <button class="btn btn-purple btn-full" onclick="cheatMoney()">Накинуть 10 000 монет</button>
            </div>
        </div>
    </div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('home', this)">
            <div class="tab-icon" style="mask-image: url('img/icon_home.svg'); -webkit-mask-image: url('img/icon_home.svg'); background-color: currentColor;"></div>
            <span class="tab-text">Главная</span>
        </button>
        <button class="tab-btn" onclick="switchTab('market', this)">
            <div class="tab-icon" style="mask-image: url('img/icon_market.svg'); -webkit-mask-image: url('img/icon_market.svg'); background-color: currentColor;"></div>
            <span class="tab-text">Рынок</span>
        </button>
        <button class="tab-btn" onclick="switchTab('empire', this)">
            <div class="tab-icon" style="mask-image: url('img/icon_empire.svg'); -webkit-mask-image: url('img/icon_empire.svg'); background-color: currentColor;"></div>
            <span class="tab-text">Империя</span>
        </button>
        <button class="tab-btn" onclick="switchTab('rating', this)">
            <div class="tab-icon" style="mask-image: url('img/icon_rating.svg'); -webkit-mask-image: url('img/icon_rating.svg'); background-color: currentColor;"></div>
            <span class="tab-text">Рейтинг</span>
        </button>
        <button class="tab-btn" onclick="switchTab('shop', this)">
            <div class="tab-icon" style="mask-image: url('img/icon_shop.svg'); -webkit-mask-image: url('img/icon_shop.svg'); background-color: currentColor;"></div>
            <span class="tab-text">Магазин</span>
        </button>
        <button class="tab-btn" onclick="switchTab('profile', this)">
            <div class="tab-icon" style="mask-image: url('img/icon_profile.svg'); -webkit-mask-image: url('img/icon_profile.svg'); background-color: currentColor;"></div>
            <span class="tab-text">Профиль</span>
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();
        
        const urlParams = new URLSearchParams(window.location.search);
        const tgUser = tg.initDataUnsafe?.user;
        const userId = tgUser ? tgUser.id : urlParams.get('user_id');
        const userName = tgUser ? tgUser.first_name : (urlParams.get('name') || "Игрок");
        
        let botUsername = "";
        let rawLeaderboard = [];

        if (!userId) {
            document.body.innerHTML = "<h3 style='padding:20px; text-align:center;'>Ошибка: Открой игру через бота!</h3>";
        } else {
            loadState(userName);
            setInterval(() => loadState(userName), 30000); 
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.3s ease-in forwards';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        function switchTab(tab, btn) {
            ['home', 'market', 'empire', 'rating', 'shop', 'profile'].forEach(t => {
                document.getElementById(`tab-${t}`).style.display = t === tab ? 'block' : 'none';
            });
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        async function loadState(name) {
            try {
                const res = await fetch(`/api/state?user_id=${userId}&name=${encodeURIComponent(name)}`);
                const data = await res.json();

                botUsername = data.bot_username;
                document.getElementById('my-gold').innerText = data.gold;
                document.getElementById('my-energy').innerText = data.energy;
                document.getElementById('income-per-hour').innerText = data.income_per_hour;

                document.getElementById('daily-btn').style.display = data.can_daily ? 'block' : 'none';
                if (data.pending_income > 0) {
                    document.getElementById('collect-btn').style.display = 'block';
                    document.getElementById('pending-amount').innerText = data.pending_income;
                } else {
                    document.getElementById('collect-btn').style.display = 'none';
                }

                if (data.can_watch_ad) {
                    document.getElementById('ad-btn').style.display = 'flex';
                    document.getElementById('ad-wait-btn').style.display = 'none';
                } else {
                    document.getElementById('ad-btn').style.display = 'none';
                    document.getElementById('ad-wait-btn').style.display = 'block';
                }

                document.getElementById('profile-name').innerText = data.my_name;
                document.getElementById('stat-ref').innerText = data.ref_count;
                document.getElementById('stat-bought').innerText = data.bought_count;
                document.getElementById('stat-sold').innerText = data.sold_count;
                if (data.is_admin) document.getElementById('admin-panel').style.display = 'block';

                // Рынок
                const marketList = document.getElementById('market-list');
                marketList.innerHTML = '';
                if(data.market.length === 0) marketList.innerHTML = "<p style='color:var(--text-muted); text-align:center; margin-top:20px;'>Пока никого нет.</p>";
                
                data.market.forEach(p => {
                    const div = document.createElement('div');
                    div.className = `card rarity-${p.rarity}`;
                    
                    // Определяем аватар (если NPC, то npc_1.jpg и т.д.)
                    let imgSrc = p.is_npc ? `img/${p.id}.jpg` : `img/avatar_1.jpg`; 
                    
                    let btnHtml = p.owner_id ? `<span style="color:var(--red); font-size: 13px; font-weight:600;">Занят</span>` 
                    : `<button class="btn btn-green" onclick="buyPlayer('${p.id}')">${p.price} 💰</button>`;
                    
                    div.innerHTML = `
                        <div class="card-left">
                            <img src="${imgSrc}" class="avatar" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <div class="avatar img-placeholder" style="display:none;">?</div>
                            <div>
                                <div class="item-title">${p.name}</div>
                                <div class="item-sub">${p.rarity}</div>
                            </div>
                        </div>
                        ${btnHtml}
                    `;
                    marketList.appendChild(div);
                });

                // Империя
                const slavesList = document.getElementById('slaves-list');
                slavesList.innerHTML = '';
                if (data.my_slaves.length === 0) slavesList.innerHTML = '<p style="color:var(--text-muted); text-align:center; margin-top:20px;">Пусто.</p>';
                
                data.my_slaves.forEach(s => {
                    const div = document.createElement('div');
                    div.className = `card rarity-${s.rarity}`;
                    
                    let imgSrc = s.is_npc ? `img/${s.id}.jpg` : `img/avatar_1.jpg`;
                    
                    let btnHtml = '';
                    if (s.is_npc) {
                        let upgCost = s.income * 100; 
                        btnHtml = `<div style="text-align:right;">
                            <div style="color:var(--green); font-size:13px; font-weight:600; margin-bottom:4px;">+${s.income} 💰/ч</div>
                            <button class="btn btn-purple" style="padding: 8px 12px; font-size:13px;" onclick="upgradeNpc('${s.id}')">Улучшить (${upgCost}💰)</button>
                        </div>`;
                    } else {
                        btnHtml = `<span style="color:var(--green); font-size:13px; font-weight:600;">+${s.income} 💰/ч</span>`;
                    }

                    div.innerHTML = `
                        <div class="card-left">
                            <img src="${imgSrc}" class="avatar" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <div class="avatar img-placeholder" style="display:none;">?</div>
                            <div>
                                <div class="item-title">${s.name}</div>
                                <div class="item-sub">Ур. ${s.level}</div>
                            </div>
                        </div>
                        ${btnHtml}
                    `;
                    slavesList.appendChild(div);
                });

                // Владелец
                const ownerInfo = document.getElementById('owner-info');
                if (data.my_owner) {
                    ownerInfo.innerHTML = `<div class="card" style="border-left-color:var(--red); flex-direction:column; align-items:flex-start; padding:16px;">
                        <div style="font-size:15px; margin-bottom:12px;">Твой владелец: <b>${data.my_owner}</b></div>
                        <button class="btn btn-red" style="width:100%;" onclick="redeemSelf()">Выкупить себя</button>
                    </div>`;
                } else {
                    ownerInfo.innerHTML = `<div class="card" style="border-left-color:var(--green); justify-content:center; padding:16px;"><b>Ты свободен!</b></div>`;
                }

                rawLeaderboard = data.leaderboard;
                renderLeaderboard();

            } catch (e) { console.error(e); }
        }

        function renderLeaderboard() {
            const sortKey = document.getElementById('lb-sort').value;
            const lbList = document.getElementById('leaderboard');
            lbList.innerHTML = '';
            let sorted = [...rawLeaderboard].sort((a, b) => b[sortKey] - a[sortKey]).slice(0, 100);
            
            sorted.forEach((u, i) => {
                let val = sortKey === 'gold' ? `${u.gold} 💰` : `+${u.income} /ч`;
                let isMe = (u.id == userId) ? "me" : "";
                
                lbList.innerHTML += `
                    <div class="lb-card ${isMe}">
                        <div class="lb-left">
                            <div class="lb-rank">${i+1}</div>
                            <div class="item-title">${u.name}</div>
                        </div>
                        <b>${val}</b>
                    </div>`;
            });
        }

        async function watchAd() {
            const btn = document.getElementById('ad-btn');
            btn.innerText = "Загрузка рекламы...";
            btn.disabled = true;
            
            setTimeout(async () => {
                const res = await fetch('/api/watch_ad', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ user_id: userId }) });
                const data = await res.json();
                if (data.success) {
                    showToast('+250 монет за просмотр!');
                    tg.HapticFeedback.notificationOccurred('success');
                } else {
                    showToast(data.error, 'error');
                }
                btn.innerText = "Посмотреть рекламу (+250 монет)";
                btn.disabled = false;
                loadState(userName);
            }, 5000);
        }

        function buyStars(item) {
            showToast('Оплата Stars будет добавлена в следующем обновлении!');
        }

        function inviteFriend() {
            if (!botUsername) return;
            const botLink = `https://t.me/${botUsername}?start=${userId}`;
            navigator.clipboard.writeText(botLink).then(() => { showToast('Ссылка скопирована в буфер обмена!'); });
            const shareText = `Присоединяйся к моей Империи! Забери свои 1000 монет:`;
            const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(botLink)}&text=${encodeURIComponent(shareText)}`;
            setTimeout(() => { tg.openTelegramLink(shareUrl); }, 500);
        }

            if (data.success) { tg.HapticFeedback.impactOccurred('light'); showToast('+50 монет!'); loadState(userName); } else showToast(data.error, 'error');
        }

            const data = await res.json();

            if (data.success) { tg.HapticFeedback.notificationOccurred('success'); showToast('Ты свободен!'); loadState(userName); } else showToast(data.error, 'error');
