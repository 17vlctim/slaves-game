<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Империя</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { 
            --bg: #17212b; 
            --card: #232e3c; 
            --text: #ffffff; 
            --text-muted: #7A8A9E;
            --primary: #2AABEE; 
            --gold: #F5B041;
            --green: #2ECC71;
            --red: #E74C3C;
            --purple: #9b59b6;
        }
        
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 80px; -webkit-tap-highlight-color: transparent; }

        .header { background: rgba(23, 33, 43, 0.9); backdrop-filter: blur(10px); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .stats { display: flex; gap: 12px; font-weight: 600; font-size: 15px; }
        .stat-pill { display: flex; align-items: center; gap: 5px; background: var(--card); padding: 6px 12px; border-radius: 20px; }
        .gold { color: var(--gold); } .energy { color: var(--green); }

        .content { padding: 15px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .tabs { display: flex; position: fixed; bottom: 0; width: 100%; background: rgba(35, 46, 60, 0.95); backdrop-filter: blur(10px); border-top: 1px solid rgba(255,255,255,0.05); padding: 8px 0 calc(8px + env(safe-area-inset-bottom)) 0; justify-content: space-around; z-index: 10; }
        .tab-btn { flex: 1; background: transparent; border: none; color: var(--text-muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: color 0.2s; }
        .tab-btn.active { color: var(--primary); }
        .tab-icon { width: 24px; height: 24px; background-color: var(--text-muted); mask-size: contain; mask-repeat: no-repeat; mask-position: center; -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; }
        .tab-btn.active .tab-icon { background-color: var(--primary); }
        .tab-text { font-size: 10px; font-weight: 600; }

        .card { background: var(--card); border-radius: 16px; padding: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.03); }
        .card-left { display: flex; align-items: center; gap: 12px; flex: 1; cursor: pointer; }
        .avatar { width: 48px; height: 48px; border-radius: 50%; background: #1a2533; object-fit: cover; }
        
        .rarity-Обычный { border-left: 3px solid #7A8A9E; } .rarity-Редкий { border-left: 3px solid var(--primary); } 
        .rarity-Эпический { border-left: 3px solid var(--purple); } .rarity-Игрок { border-left: 3px solid var(--gold); }

        .item-title { font-size: 15px; font-weight: 600; margin-bottom: 2px;}
        .item-sub { font-size: 12px; color: var(--text-muted); }

        .btn { padding: 10px 16px; border-radius: 12px; border: none; color: white; font-weight: 600; cursor: pointer; font-size: 14px; text-align: center; transition: opacity 0.2s, transform 0.1s; background: var(--primary); }
        .btn:active { transform: scale(0.96); opacity: 0.8; }
        .btn-green { background: var(--green); color: #000; }
        .btn-red { background: var(--red); }
        .btn-purple { background: var(--purple); }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-icon { padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.1); color: white; font-weight: bold; font-size: 16px; width: 40px; display: flex; justify-content: center; align-items: center;}
        .btn-full { width: 100%; padding: 16px; font-size: 16px; margin-bottom: 12px; border-radius: 16px; display: flex; justify-content: center; align-items: center; gap: 8px;}
        
        .income-block { text-align: center; background: linear-gradient(180deg, #232e3c 0%, #17212b 100%); padding: 30px 20px; border-radius: 24px; margin-bottom: 20px; border: 1px solid rgba(42, 171, 238, 0.2); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .income-block h1 { margin: 0; font-size: 42px; color: var(--gold); font-weight: 800; }
        .income-block p { margin: 5px 0 0 0; color: var(--text-muted); font-size: 14px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px;}

        .profile-info { text-align: center; padding: 20px; margin-bottom: 20px; }
        .profile-avatar { width: 90px; height: 90px; border-radius: 50%; background: var(--card); margin: 0 auto 15px auto; border: 3px solid var(--primary); object-fit: cover;}
        .profile-name { font-size: 22px; font-weight: 700; margin: 0; }
        
        .stat-row { display: flex; justify-content: space-between; padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 15px;}
        .stat-row:last-child { border-bottom: none; }
        .stat-row span { color: var(--text-muted); }
        .stat-row b { font-weight: 600; }

        .select-custom { width: 100%; padding: 14px; margin-bottom: 20px; border-radius: 14px; background: var(--card); color: white; border: none; font-size: 15px; font-weight: 600; outline: none; appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23FFFFFF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 15px top 50%; background-size: 12px auto; }
        .lb-card { display: flex; justify-content: space-between; padding: 12px 15px; background: var(--card); margin-bottom: 8px; border-radius: 14px; align-items: center; border: 1px solid transparent; cursor: pointer;}
        .lb-card.me { border-color: var(--primary); background: rgba(42, 171, 238, 0.1); }
        .lb-left { display: flex; align-items: center; gap: 12px; }
        .lb-rank { font-size: 16px; font-weight: 700; color: var(--text-muted); width: 25px; }
        
        .shop-item { background: var(--card); border-radius: 20px; padding: 20px; text-align: center; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .shop-item h3 { margin: 0 0 5px 0; color: var(--text); font-size: 18px;}
        .shop-item p { color: var(--text-muted); font-size: 13px; margin-bottom: 15px;}
        
        .admin-panel { margin-top: 20px; padding: 15px; border: 2px dashed var(--purple); border-radius: 16px; }

        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; width: 90%; max-width: 400px; }
        .toast { background: var(--card); color: white; padding: 14px 20px; border-radius: 14px; font-weight: 600; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; animation: slideDown 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; border: 1px solid rgba(255,255,255,0.1); }
        .toast.success { border-bottom: 3px solid var(--green); }
        .toast.error { border-bottom: 3px solid var(--red); }
        @keyframes slideDown { from { top: -100px; opacity: 0; } to { top: 0; opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; transform: scale(0.9); } to { opacity: 0; } }

        .img-placeholder { background: #1a2533; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: var(--text-muted); font-size: 20px; }

        /* СТИЛИ ДЛЯ МОДАЛЬНОГО ОКНА (ПРОФИЛЬ) */
        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
            z-index: 100; display: none; justify-content: center; align-items: flex-end;
            animation: fadeIn 0.2s ease;
        }
        .modal-content {
            background: var(--bg); width: 100%; max-width: 500px;
            border-radius: 24px 24px 0 0; padding: 20px;
            animation: slideUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 85vh; overflow-y: auto;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .modal-close {
            display: block; width: 40px; height: 4px; background: rgba(255,255,255,0.2);
            border-radius: 2px; margin: 0 auto 20px auto; cursor: pointer;
        }
        
        .modal-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .modal-header img { width: 70px; height: 70px; border-radius: 50%; border: 2px solid var(--primary); background: #1a2533; }
        .modal-title { font-size: 22px; font-weight: 700; margin: 0; }
        .modal-sub { color: var(--text-muted); font-size: 14px; margin-top: 4px; }
        
        .modal-stats { display: flex; justify-content: space-between; background: var(--card); padding: 15px; border-radius: 16px; margin-bottom: 20px; }
        .modal-stat-item { text-align: center; }
        .modal-stat-val { font-size: 18px; font-weight: 700; color: var(--gold); }
        .modal-stat-lbl { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-top: 4px;}
        
        .modal-section-title { font-size: 16px; font-weight: 600; margin-bottom: 10px; color: var(--text); }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <!-- МОДАЛЬНОЕ ОКНО ПРОФИЛЯ -->
    <div id="modal-overlay" onclick="closeProfile(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-close" onclick="closeProfile(event)"></div>
            
            <div class="modal-header">
                <img id="modal-avatar" src="img/avatar_1.jpg" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="img-placeholder" style="width:70px; height:70px; display:none;">?</div>
                <div>
                    <h2 id="modal-name" class="modal-title">Имя</h2>
                    <div id="modal-id" class="modal-sub">ID: ...</div>
                </div>
            </div>

            <div class="modal-stats">
                <div class="modal-stat-item">
                    <div id="modal-gold" class="modal-stat-val">0</div>
                    <div class="modal-stat-lbl">Золото</div>
                </div>
                <div class="modal-stat-item">
                    <div id="modal-income" class="modal-stat-val" style="color:var(--green)">0</div>
                    <div class="modal-stat-lbl">В час</div>
                </div>
            </div>

            <div id="modal-owner-block" style="margin-bottom: 20px; text-align: center; font-size: 14px; color: var(--text-muted);">
                Владелец: <b id="modal-owner">Нет</b>
            </div>

            <div class="modal-section-title">Рабы игрока (<span id="modal-slaves-count">0</span>):</div>
            <div id="modal-slaves-list" style="margin-bottom: 20px;">
                <!-- Сюда будут вставляться карточки рабов -->
            </div>
            
            <button id="modal-action-btn" class="btn btn-green btn-full" onclick="buyFromModal()" style="display:none;">Купить игрока</button>
        </div>
    </div>

    <div class="header">
        <div class="stats">
            <div class="stat-pill gold"><span>💰</span> <span id="my-gold">0</span></div>
            <div class="stat-pill energy"><span>⚡</span> <span id="my-energy">0</span></div>
        </div>
    </div>

    <div class="content">
        <!-- ВКЛАДКИ (как в прошлой версии, я оставил только структуру для примера, вставь свои ID) -->
        <div id="tab-home" style="display: block;">
            <div class="income-block">
                <h1><span id="income-per-hour">0</span></h1>
                <p>Доход в час</p>
            </div>
            <button id="daily-btn" class="btn btn-gold btn-full" onclick="claimDaily()" style="display:none;">Забрать бонус</button>
            <button id="collect-btn" class="btn btn-green btn-full" onclick="collectIncome()" style="display:none;">Собрать <span id="pending-amount">0</span></button>
            <button class="btn btn-full" style="background: var(--card);" onclick="doWork()">Поработать</button>
            <button id="ad-btn" class="btn btn-full" style="background: var(--card); color: var(--primary);" onclick="watchAd()">Реклама (+250)</button>
        </div>

        <div id="tab-market" style="display: none;">
            <h3 style="margin-top:0;">Рынок</h3>
            <div id="market-list"></div>
        </div>

        <div id="tab-empire" style="display: none;">
            <div id="owner-info" style="margin-bottom: 15px;"></div>
            <h3 style="margin-top:0;">Мои подчиненные</h3>
            <div id="slaves-list"></div>
        </div>

        <div id="tab-rating" style="display: none;">
            <select id="lb-sort" class="select-custom" onchange="renderLeaderboard()">
                <option value="gold">Топ по богатству</option>
                <option value="income">Топ по доходу</option>
            </select>
            <div id="leaderboard"></div>
        </div>

        <div id="tab-shop" style="display: none;">
            <!-- Магазин -->
            <h3 style="text-align:center;">Магазин</h3>
        </div>

        <div id="tab-profile" style="display: none;">
            <div class="profile-info">
                <img src="img/avatar_1.jpg" class="profile-avatar" onerror="this.style.display='none';">
                <h2 id="profile-name" class="profile-name">Игрок</h2>
            </div>
            <div class="card" style="flex-direction: column; align-items: stretch; padding: 0;">
                <div class="stat-row"><span>Друзей:</span> <b id="stat-ref">0</b></div>
                <div class="stat-row"><span>Куплено:</span> <b id="stat-bought">0</b></div>
            </div>
            <button class="btn btn-green btn-full" style="margin-top: 20px;" onclick="inviteFriend()">Пригласить друга</button>
            <div id="admin-panel" class="admin-panel">
                <button class="btn btn-purple btn-full" onclick="cheatMoney()">Накинуть 10 000</button>
            </div>
        </div>
    </div>

    <!-- НИЖНЕЕ МЕНЮ (Скопируй из предыдущего кода) -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('home', this)"><div class="tab-icon" style="mask-image: url('img/icon_home.svg'); -webkit-mask-image: url('img/icon_home.svg');"></div><span class="tab-text">Главная</span></button>
        <button class="tab-btn" onclick="switchTab('market', this)"><div class="tab-icon" style="mask-image: url('img/icon_market.svg'); -webkit-mask-image: url('img/icon_market.svg');"></div><span class="tab-text">Рынок</span></button>
        <button class="tab-btn" onclick="switchTab('empire', this)"><div class="tab-icon" style="mask-image: url('img/icon_empire.svg'); -webkit-mask-image: url('img/icon_empire.svg');"></div><span class="tab-text">Империя</span></button>
        <button class="tab-btn" onclick="switchTab('rating', this)"><div class="tab-icon" style="mask-image: url('img/icon_rating.svg'); -webkit-mask-image: url('img/icon_rating.svg');"></div><span class="tab-text">Рейтинг</span></button>
        <button class="tab-btn" onclick="switchTab('shop', this)"><div class="tab-icon" style="mask-image: url('img/icon_shop.svg'); -webkit-mask-image: url('img/icon_shop.svg');"></div><span class="tab-text">Магазин</span></button>
        <button class="tab-btn" onclick="switchTab('profile', this)"><div class="tab-icon" style="mask-image: url('img/icon_profile.svg'); -webkit-mask-image: url('img/icon_profile.svg');"></div><span class="tab-text">Профиль</span></button>
    </div>

    <script>
        // ... (КОД JS ИЗ ПРЕДЫДУЩЕГО СООБЩЕНИЯ, добавь эти функции) ...

        let currentModalTargetId = null;

        // В функции loadState(), где рендерится рынок (data.market.forEach), измени верстку кнопок:
        /*
            let btnHtml = p.owner_id ? `<span style="color:var(--red); font-size: 13px; font-weight:600;">Занят</span>` 
            : `<div style="display:flex; gap:8px;">
                 <button class="btn btn-icon" onclick="openProfile('${p.id}')">i</button>
                 <button class="btn btn-green" onclick="buyPlayer('${p.id}')">${p.price} 💰</button>
               </div>`;
            
            // И добавь onclick на саму карточку (на левую часть):
            // <div class="card-left" onclick="openProfile('${p.id}')">
        */

        // В функции renderLeaderboard() добавь onclick на карточки:
        // <div class="lb-card ${isMe}" onclick="openProfile('${u.id}')">

        async function openProfile(targetId) {
            currentModalTargetId = targetId;
            const res = await fetch(`/api/user_info?target_id=${targetId}`);
            const data = await res.json();
            
            if (data.error) return showToast(data.error, 'error');

            document.getElementById('modal-name').innerText = data.name;
            document.getElementById('modal-id').innerText = `ID: ${data.id}`;
            document.getElementById('modal-gold').innerText = data.gold;
            document.getElementById('modal-income').innerText = `+${data.income}`;
            document.getElementById('modal-owner').innerText = data.owner_name || "Свободен";
            document.getElementById('modal-slaves-count').innerText = data.slaves.length;

            // Если игрок не куплен и это не я сам, показываем кнопку покупки
            const actionBtn = document.getElementById('modal-action-btn');
            if (!data.owner_name && data.id != userId) {
                actionBtn.style.display = 'flex';
                actionBtn.innerText = `Купить за ${1000 + (data.name.length * 10)} 💰`;
            } else {
                actionBtn.style.display = 'none';
            }

            // Рендер рабов
            const slavesList = document.getElementById('modal-slaves-list');
            slavesList.innerHTML = '';
            if (data.slaves.length === 0) {
                slavesList.innerHTML = '<div style="color:var(--text-muted); font-size:13px; text-align:center;">Нет рабов</div>';
            } else {
                data.slaves.forEach(s => {
                    let imgSrc = s.is_npc ? `img/${s.id}.jpg` : `img/avatar_2.jpg`; // Допустим, у людей аватар 2
                    slavesList.innerHTML += `
                        <div class="card" style="padding: 10px; margin-bottom: 8px;">
                            <div class="card-left">
                                <img src="${imgSrc}" class="avatar" style="width:36px; height:36px;" onerror="this.style.display='none';">
                                <div>
                                    <div class="item-title" style="font-size:14px;">${s.name}</div>
                                    <div class="item-sub" style="font-size:11px;">${s.rarity}</div>
                                </div>
                            </div>
                            <span style="color:var(--green); font-size:12px; font-weight:bold;">+${s.income} 💰/ч</span>
                        </div>
                    `;
                });
            }

            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function closeProfile(event) {
            document.getElementById('modal-overlay').style.display = 'none';
            currentModalTargetId = null;
        }

        function buyFromModal() {
            if (currentModalTargetId) {
                closeProfile();
                buyPlayer(currentModalTargetId);
            }
        }
    </script>
</body>
</html>
