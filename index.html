<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Империя</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #17212b; color: white; margin: 0; padding-bottom: 70px; }
        .header { background: #242f3d; padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #333; }
        .stats { display: flex; gap: 15px; font-weight: bold; }
        .gold { color: #f1c40f; } .energy { color: #2ecc71; }
        
        .content { padding: 15px; }
        
        /* Нижнее меню */
        .tabs { display: flex; position: fixed; bottom: 0; width: 100%; z-index: 10; background: #242f3d; padding-bottom: env(safe-area-inset-bottom); }
        .tab-btn { flex: 1; padding: 10px 5px; background: transparent; border: none; color: #aaa; font-size: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tab-btn.active { color: #2481cc; }
        .tab-btn .icon { font-size: 20px; }

        /* Карточки */
        .card { background: #242f3d; border-radius: 12px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #555; }
        .rarity-Обычный { border-left-color: #aaa; } 
        .rarity-Редкий { border-left-color: #3498db; } 
        .rarity-Эпический { border-left-color: #9b59b6; } 
        .rarity-Игрок { border-left-color: #e67e22; }

        /* Кнопки */
        .btn { padding: 12px 15px; border-radius: 10px; border: none; color: white; font-weight: bold; cursor: pointer; font-size: 14px; text-align: center; }
        .btn-green { background: #2ecc71; color: #000; }
        .btn-red { background: #e74c3c; }
        .btn-orange { background: #e67e22; }
        .btn-purple { background: #9b59b6; }
        .btn-yellow { background: #f1c40f; color: #000; }
        .btn-full { width: 100%; margin-bottom: 10px; padding: 15px; font-size: 16px;}
        
        /* Главная страница */
        .income-block { text-align: center; background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%); padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        .income-block h1 { margin: 0; font-size: 32px; color: #f1c40f; }
        .income-block p { margin: 5px 0 0 0; color: #ddd; }

        /* Профиль */
        .profile-info { text-align: center; background: #242f3d; padding: 20px; border-radius: 15px; margin-bottom: 15px; }
        .profile-avatar { font-size: 50px; margin-bottom: 10px; }
        .profile-stat { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #333; }
        
        .admin-panel { display: none; margin-top: 20px; padding: 15px; border: 2px dashed #9b59b6; border-radius: 10px; }
        .lb-card { display: flex; justify-content: space-between; padding: 12px; background: #242f3d; margin-bottom: 8px; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="stats">
            <span class="gold">💰 <span id="my-gold">0</span></span>
            <span class="energy">⚡ <span id="my-energy">0</span></span>
        </div>
    </div>

    <div class="content">
        <!-- 1. ГЛАВНАЯ -->
        <div id="tab-home" style="display: block;">
            <div class="income-block">
                <h1><span id="income-per-hour">0</span> 💰/час</h1>
                <p>Твой пассивный доход</p>
            </div>
            
            <button id="daily-btn" class="btn btn-yellow btn-full" onclick="claimDaily()" style="display:none;">🎁 Забрать ежедневный бонус</button>
            <button id="collect-btn" class="btn btn-yellow btn-full" onclick="collectIncome()" style="display:none;">Забрать <span id="pending-amount">0</span>💰</button>
            
            <button class="btn btn-orange btn-full" onclick="doWork()">🔨 Поработать (-10⚡, +50💰)</button>
        </div>

        <!-- 2. РЫНОК -->
        <div id="tab-market" style="display: none;">
            <h3>Глобальный рынок:</h3>
            <div id="market-list">Загрузка...</div>
        </div>

        <!-- 3. ИМПЕРИЯ -->
        <div id="tab-empire" style="display: none;">
            <div id="owner-info" style="margin-bottom: 15px;"></div>
            <h3>Мои подчиненные:</h3>
            <div id="slaves-list">Загрузка...</div>
        </div>

        <!-- 4. РЕЙТИНГ -->
        <div id="tab-rating" style="display: none;">
            <h3>🏆 Топ-5 игроков</h3>
            <div id="leaderboard">Загрузка...</div>
        </div>

        <!-- 5. ПРОФИЛЬ -->
        <div id="tab-profile" style="display: none;">
            <div class="profile-info">
                <div class="profile-avatar">👤</div>
                <h2 id="profile-name" style="margin:0;">Игрок</h2>
            </div>
            
            <div class="card" style="flex-direction: column; align-items: stretch; padding: 0;">
                <div class="profile-stat"><span>Приглашено друзей:</span> <b id="stat-ref">0</b></div>
                <div class="profile-stat"><span>Куплено рабов:</span> <b id="stat-bought">0</b></div>
                <div class="profile-stat" style="border:none;"><span>Раз продан:</span> <b id="stat-sold">0</b></div>
            </div>

            <button class="btn btn-green btn-full" style="margin-top: 15px;" onclick="inviteFriend()">🤝 Пригласить друга (+500💰)</button>

            <div id="admin-panel" class="admin-panel">
                <h4 style="margin-top:0; color:#9b59b6;">Панель Владельца</h4>
                <button class="btn btn-purple btn-full" onclick="cheatMoney()">💸 Накинуть 10 000 монет</button>
            </div>
        </div>
    </div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('home', this)"><span class="icon">🏠</span>Главная</button>
        <button class="tab-btn" onclick="switchTab('market', this)"><span class="icon">🛒</span>Рынок</button>
        <button class="tab-btn" onclick="switchTab('empire', this)"><span class="icon">👑</span>Империя</button>
        <button class="tab-btn" onclick="switchTab('rating', this)"><span class="icon">🏆</span>Рейтинг</button>
        <button class="tab-btn" onclick="switchTab('profile', this)"><span class="icon">👤</span>Профиль</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();
        
        const urlParams = new URLSearchParams(window.location.search);
        const tgUser = tg.initDataUnsafe?.user;
        const userId = tgUser ? tgUser.id : urlParams.get('user_id');
        const userName = tgUser ? tgUser.first_name : (urlParams.get('name') || "Игрок");

        if (!userId) {
            document.body.innerHTML = "<h3 style='padding:20px; text-align:center;'>Ошибка: Открой игру через бота!</h3>";
        } else {
            loadState(userName);
            setInterval(() => loadState(userName), 30000); 
        }

        function switchTab(tab, btn) {
            ['home', 'market', 'empire', 'rating', 'profile'].forEach(t => {
                document.getElementById(`tab-${t}`).style.display = t === tab ? 'block' : 'none';
            });
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        async function loadState(name) {
            try {
                const res = await fetch(`/api/state?user_id=${userId}&name=${encodeURIComponent(name)}`);
                const data = await res.json();

                // Обновляем шапку
                document.getElementById('my-gold').innerText = data.gold;
                document.getElementById('my-energy').innerText = data.energy;
                document.getElementById('income-per-hour').innerText = data.income_per_hour;

                // Кнопки на главной
                document.getElementById('daily-btn').style.display = data.can_daily ? 'block' : 'none';
                if (data.pending_income > 0) {
                    document.getElementById('collect-btn').style.display = 'block';
                    document.getElementById('pending-amount').innerText = data.pending_income;
                } else {
                    document.getElementById('collect-btn').style.display = 'none';
                }

                // Профиль
                document.getElementById('profile-name').innerText = data.my_name;
                document.getElementById('stat-ref').innerText = data.ref_count;
                document.getElementById('stat-bought').innerText = data.bought_count;
                document.getElementById('stat-sold').innerText = data.sold_count;
                if (data.is_admin) document.getElementById('admin-panel').style.display = 'block';

                // Рынок
                const marketList = document.getElementById('market-list');
                marketList.innerHTML = '';
                if(data.market.length === 0) marketList.innerHTML = "<p style='color:#aaa;'>Пока никого нет.</p>";
                
                data.market.forEach(p => {
                    const div = document.createElement('div');
                    div.className = `card rarity-${p.rarity}`;
                    let btnHtml = p.owner_id ? `<span style="color:#e74c3c; font-size: 12px; font-weight:bold;">Занят</span>` 
                    : `<button class="btn btn-green" onclick="buyPlayer('${p.id}')">Купить<br>${p.price}💰</button>`;
                    
                    div.innerHTML = `<div><b>${p.name}</b><br><small style="color:#aaa;">${p.rarity}</small></div> ${btnHtml}`;
                    marketList.appendChild(div);
                });

                // Империя
                const slavesList = document.getElementById('slaves-list');
                slavesList.innerHTML = '';
                if (data.my_slaves.length === 0) slavesList.innerHTML = '<p style="color:#aaa;">Пусто.</p>';
                
                data.my_slaves.forEach(s => {
                    const div = document.createElement('div');
                    div.className = `card rarity-${s.rarity}`;
                    let btnHtml = '';
                    
                    if (s.is_npc) {
                        let upgCost = s.income * 100; 
                        btnHtml = `<div style="text-align:right;"><span style="color:#2ecc71; font-size:12px; display:block; margin-bottom:5px;">+${s.income}💰/час</span>
                        <button class="btn btn-purple" style="padding: 8px;" onclick="upgradeNpc('${s.id}')">Улучшить<br><small>${upgCost}💰</small></button></div>`;
                    } else {
                        btnHtml = `<span style="color:#2ecc71; font-size:12px;">+${s.income}💰/час</span>`;
                    }

                    div.innerHTML = `<div><b>${s.name}</b><br><small style="color:#aaa;">Ур. ${s.level}</small></div> ${btnHtml}`;
                    slavesList.appendChild(div);
                });

                // Владелец
                const ownerInfo = document.getElementById('owner-info');
                if (data.my_owner) {
                    ownerInfo.innerHTML = `<div class="card" style="border-left-color:#e74c3c; flex-direction:column; align-items:flex-start;">
                        <div>Владелец: <b>${data.my_owner}</b></div>
                        <button class="btn btn-red" style="width:100%; margin-top:10px;" onclick="redeemSelf()">Выкупить себя</button>
                    </div>`;
                } else {
                    ownerInfo.innerHTML = `<div class="card" style="border-left-color:#2ecc71; justify-content:center;">Ты свободен</div>`;
                }

                // Рейтинг
                const lbList = document.getElementById('leaderboard');
                lbList.innerHTML = '';
                data.leaderboard.forEach((u, i) => {
                    lbList.innerHTML += `<div class="lb-card"><span>${i+1}. ${u.name}</span> <b>${u.gold}💰</b></div>`;
                });

            } catch (e) { console.error(e); }
        }

        function inviteFriend() {
            const botLink = `https://t.me/${tg.initDataUnsafe?.receiver?.username || 'your_bot_username'}?start=${userId}`;
            tg.showAlert(`Твоя ссылка для друзей:\n${botLink}\n\nСкопируй её и отправь другу!`);
        }

        async function claimDaily() {
            const res = await fetch('/api/daily', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ user_id: userId }) });
            const data = await res.json();
            if (data.success) { tg.HapticFeedback.notificationOccurred('success'); loadState(userName); } else alert(data.error);
        }

        async function collectIncome() {
            const res = await fetch('/api/collect', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ user_id: userId }) });
            const data = await res.json();
            if (data.success) { tg.HapticFeedback.notificationOccurred('success'); loadState(userName); } else alert(data.error);
        }

        async function doWork() {
            const res = await fetch('/api/work', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ user_id: userId }) });
            const data = await res.json();
            if (data.success) { tg.HapticFeedback.impactOccurred('light'); loadState(userName); } else alert(data.error);
        }

        async function buyPlayer(targetId) {
            if(!confirm("Купить?")) return;
            const res = await fetch('/api/buy', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ user_id: userId, target_id: targetId }) });
            const data = await res.json();
            if (data.success) { tg.HapticFeedback.notificationOccurred('success'); loadState(userName); } else alert(data.error);
        }

        async function upgradeNpc(targetId) {
            const res = await fetch('/api/upgrade', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ user_id: userId, target_id: targetId }) });
            const data = await res.json();
            if (data.success) { tg.HapticFeedback.notificationOccurred('success'); loadState(userName); } else alert(data.error);
        }

        async function redeemSelf() {
            if(!confirm("Выкупить себя?")) return;
            const res = await fetch('/api/redeem', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ user_id: userId }) });
            const data = await res.json();
            if (data.success) { tg.HapticFeedback.notificationOccurred('success'); loadState(userName); } else alert(data.error);
        }

        async function cheatMoney() {
            const res = await fetch('/api/admin_cheat', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ user_id: userId, amount: 10000 }) });
            const data = await res.json();
            if (data.success) { loadState(userName); } else alert(data.error);
        }
    </script>
</body>
</html>
