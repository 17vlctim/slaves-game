<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Империя</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #17212b; color: white; margin: 0; padding-bottom: 60px; }
        .header { background: #242f3d; padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
        .stats { display: flex; gap: 15px; font-weight: bold; }
        .gold { color: #f1c40f; }
        .energy { color: #2ecc71; }
        
        .content { padding: 15px; }
        .tab-btn { flex: 1; padding: 12px; background: #242f3d; border: none; color: #aaa; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background: #2481cc; color: white; }
        .tabs { display: flex; position: fixed; bottom: 0; width: 100%; z-index: 10; }
        
        .card { background: #242f3d; border-radius: 10px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .btn { padding: 10px 15px; border-radius: 8px; border: none; background: #2481cc; color: white; font-weight: bold; cursor: pointer; font-size: 14px;}
        .btn:active { background: #1e6da8; }
        .btn-green { background: #2ecc71; color: #000; }
        .btn-red { background: #e74c3c; }
        .btn-orange { background: #e67e22; }
        .btn-admin { background: #9b59b6; width: 100%; margin-top: 15px; }
        
        .admin-panel { display: none; margin-top: 20px; padding: 15px; border: 2px dashed #9b59b6; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="stats">
            <span class="gold">💰 <span id="my-gold">0</span></span>
            <span class="energy">⚡ <span id="my-energy">0</span></span>
        </div>
    </div>

    <div class="content">
        <!-- Вкладка Рынок -->
        <div id="tab-market" style="display: block;">
            <button class="btn btn-orange" style="width:100%; margin-bottom: 15px; padding: 15px;" onclick="doWork()">🔨 Поработать (-10⚡, +50💰)</button>
            <h3>Глобальный рынок:</h3>
            <div id="market-list">Загрузка...</div>

            <!-- Админ Панель -->
            <div id="admin-panel" class="admin-panel">
                <h4 style="margin-top:0; color:#9b59b6;">Панель Владельца</h4>
                <button class="btn btn-admin" onclick="cheatMoney()">💸 Накинуть 10 000 монет</button>
            </div>
        </div>

        <!-- Вкладка Империя -->
        <div id="tab-empire" style="display: none;">
            <div id="owner-info" style="margin-bottom: 15px;"></div>
            <h3>Мои подчиненные:</h3>
            <div id="slaves-list">Загрузка...</div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('market')">Рынок</button>
        <button class="tab-btn" onclick="switchTab('empire')">Империя</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();
        
        const urlParams = new URLSearchParams(window.location.search);
        const tgUser = tg.initDataUnsafe?.user;
        const userId = tgUser ? tgUser.id : urlParams.get('user_id');
        const userName = tgUser ? tgUser.first_name : (urlParams.get('name') || "Игрок");

        if (!userId) {
            document.body.innerHTML = "<h3 style='padding:20px; text-align:center;'>Ошибка: Открой игру через кнопку в боте!</h3>";
        } else {
            loadState(userName);
        }

        function switchTab(tab) {
            document.getElementById('tab-market').style.display = tab === 'market' ? 'block' : 'none';
            document.getElementById('tab-empire').style.display = tab === 'empire' ? 'block' : 'none';
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        async function loadState(name) {
            try {
                const res = await fetch(`/api/state?user_id=${userId}&name=${encodeURIComponent(name)}`);
                const data = await res.json();

                document.getElementById('my-gold').innerText = data.gold;
                document.getElementById('my-energy').innerText = data.energy;

                // Админка
                if (data.is_admin) {
                    document.getElementById('admin-panel').style.display = 'block';
                }

                // Рынок
                const marketList = document.getElementById('market-list');
                marketList.innerHTML = '';
                if(data.market.length === 0) marketList.innerHTML = "<p style='color:#aaa;'>Пока никого нет.</p>";
                
                data.market.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'card';
                    
                    let btnHtml = '';
                    if (p.owner_id) {
                        btnHtml = `<span style="color:#e74c3c; font-size: 12px; font-weight:bold;">Занят</span>`;
                    } else {
                        let npcTag = p.is_npc ? "🤖" : "👤";
                        btnHtml = `<button class="btn btn-green" onclick="buyPlayer('${p.id}')">Купить<br>${p.price}💰</button>`;
                    }
                    
                    let nameStr = p.is_npc ? `🤖 ${p.name}` : p.name;
                    div.innerHTML = `<div style="font-size:16px;"><b>${nameStr}</b></div> ${btnHtml}`;
                    marketList.appendChild(div);
                });

                // Империя
                const slavesList = document.getElementById('slaves-list');
                slavesList.innerHTML = '';
                if (data.my_slaves.length === 0) {
                    slavesList.innerHTML = '<p style="color:#aaa;">У тебя пока никого нет.</p>';
                } else {
                    data.my_slaves.forEach(s => {
                        const div = document.createElement('div');
                        div.className = 'card';
                        let nameStr = s.is_npc ? `🤖 ${s.name}` : s.name;
                        div.innerHTML = `<div style="font-size:16px;"><b>${nameStr}</b></div> <span style="color:#2ecc71; font-size:12px;">+${s.income}💰/час</span>`;
                        slavesList.appendChild(div);
                    });
                }

                // Владелец
                const ownerInfo = document.getElementById('owner-info');
                if (data.my_owner) {
                    ownerInfo.innerHTML = `
                        <div class="card" style="border: 1px solid #e74c3c; flex-direction: column; align-items: flex-start; gap: 10px;">
                            <div style="font-size:16px;">Твой владелец: <b>${data.my_owner}</b></div>
                            <button class="btn btn-red" style="width:100%;" onclick="redeemSelf()">Выкупить себя</button>
                        </div>`;
                } else {
                    ownerInfo.innerHTML = `<div class="card" style="border: 1px solid #2ecc71; justify-content:center;"><b>Ты свободен!</b></div>`;
                }
            } catch (e) { console.error(e); }
        }

        async function doWork() {
            const res = await fetch('/api/work', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ user_id: userId }) });
            const data = await res.json();
            if (data.success) { if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light'); loadState(userName); } 
            else alert(data.error);
        }

        async function buyPlayer(targetId) {
            if(!confirm("Точно купить?")) return;
            const res = await fetch('/api/buy', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ user_id: userId, target_id: targetId }) });
            const data = await res.json();
            if (data.success) { if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success'); loadState(userName); } 
            else alert(data.error);
        }

        async function redeemSelf() {
            if(!confirm("Выкупить себя из рабства?")) return;
            const res = await fetch('/api/redeem', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ user_id: userId }) });
            const data = await res.json();
            if (data.success) { if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success'); loadState(userName); } 
            else alert(data.error);
        }

        // АДМИНСКАЯ ФУНКЦИЯ
        async function cheatMoney() {
            const res = await fetch('/api/admin_cheat', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ user_id: userId, amount: 10000 }) });
            const data = await res.json();
            if (data.success) { loadState(userName); } else { alert(data.error); }
        }
    </script>
</body>
</html>
